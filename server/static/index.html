<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>智能叫号 · 01 诊室</title>
<style>
  :root {
    --bg: #0b1220;
    --card: #151f33;
    --line: #24344f;
    --text: #e8eefc;
    --muted: #8fa4c4;
    --accent: #38bdf8;
    --ok: #22c55e;
    --warn: #f59e0b;
    --off: #64748b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(120% 80% at 50% 0%, #17233c 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  body { display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card {
    width: 100%; max-width: 460px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 20px 20px 14px;
    box-shadow: 0 18px 48px rgba(0, 0, 0, .45);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 14px; border-bottom: 1px solid var(--line);
  }
  .room { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .badge {
    font-size: 13px; padding: 4px 10px; border-radius: 999px;
    background: rgba(143, 164, 196, .18); color: var(--muted);
  }
  .badge.on  { background: rgba(34, 197, 94, .16); color: var(--ok); }
  .badge.off { background: rgba(100, 116, 139, .22); color: #b6c2d4; }
  .main { text-align: center; padding: 26px 0 22px; }
  .label { font-size: 14px; color: var(--muted); letter-spacing: 3px; }
  .ticket {
    margin-top: 10px;
    font-size: clamp(64px, 23vw, 112px);
    line-height: 1.02;
    font-weight: 800;
    letter-spacing: 4px;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    text-shadow: 0 0 36px rgba(56, 189, 248, .35);
    transition: color .2s;
  }
  body.paused .ticket { color: var(--warn); text-shadow: 0 0 36px rgba(245, 158, 11, .3); }
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat { padding: 16px 4px; text-align: center; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat b {
    display: block; font-size: 26px; font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .stat span { display: block; margin-top: 4px; font-size: 12px; color: var(--muted); }
  footer {
    padding-top: 12px; text-align: center;
    font-size: 12px; color: var(--muted);
  }
  .mine {
    margin-top: 16px; padding: 16px;
    border: 1px dashed var(--line); border-radius: 14px;
    text-align: center; background: rgba(56, 189, 248, .05);
  }
  .mine.called { border-color: var(--ok); background: rgba(34, 197, 94, .1); }
  .mine-num { font-size: 34px; font-weight: 800; letter-spacing: 3px; color: var(--text); }
  .mine-tip { margin-top: 6px; font-size: 13px; color: var(--muted); }
  .mine.called .mine-tip { color: var(--ok); font-weight: 600; }
  .take {
    display: block; width: 100%; margin-top: 14px; padding: 14px;
    border: 0; border-radius: 12px; cursor: pointer;
    font-size: 16px; font-weight: 600; color: #04121f;
    background: linear-gradient(180deg, #7dd3fc, #38bdf8);
  }
  .take:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
  <div class="card">
    <header>
      <span class="room">01 诊室</span>
      <span id="status" class="badge">连接中</span>
    </header>

    <section class="main">
      <div class="label">正在叫号</div>
      <div id="ticket" class="ticket">--</div>
    </section>

    <section class="stats">
      <div class="stat"><b id="waiting">-</b><span>等候人数</span></div>
      <div class="stat"><b id="passed">-</b><span>过号人数</span></div>
      <div class="stat"><b id="paused">-</b><span>叫号状态</span></div>
    </section>

    <section class="mine" id="mine" hidden>
      <div class="mine-num" id="myTicket">--</div>
      <div class="mine-tip" id="myTip">前面还有 -- 人</div>
    </section>

    <button id="takeBtn" class="take">我要取号</button>

    <footer><span id="updated">数据加载中…</span></footer>
  </div>

<script>
  var ROOM = new URLSearchParams(location.search).get('room') || '01';
  var REFRESH_MS = 2000;

  function $(id) { return document.getElementById(id); }

  function setBadge(text, cls) {
    var el = $('status');
    el.textContent = text;
    el.className = 'badge' + (cls ? ' ' + cls : '');
  }

  function render(d) {
    $('ticket').textContent  = d.current || '--';
    $('waiting').textContent = d.waiting;
    $('passed').textContent  = d.passed;
    $('paused').textContent  = d.paused ? '暂停' : '正常';
    $('updated').textContent = '最后更新 ' + (d.updated_at || '--');
    document.body.classList.toggle('paused', !!d.paused);

    if (d.online) {
      setBadge('在线', 'on');
    } else {
      setBadge('终端离线', 'off');
    }
  }

  function refresh() {
    fetch('/api/queue?room=' + encodeURIComponent(ROOM), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(render)
      .catch(function () {
        setBadge('连接中断', 'off');
      });
  }

  // ---------------- 取号 ----------------
  var TICKET_KEY = 'smartcall_ticket_' + ROOM;
  var myTicket = localStorage.getItem(TICKET_KEY) || '';

  function showMine(ticket, ahead, called) {
    var box = $('mine');
    if (!ticket) { box.hidden = true; return; }
    box.hidden = false;
    $('myTicket').textContent = ticket;
    $('myTip').textContent = called ? '请立即前往诊室' : ('前面还有 ' + ahead + ' 人');
    box.classList.toggle('called', !!called);
  }

  function queryMine() {
    if (!myTicket) { return; }
    fetch('/api/ticket?room=' + encodeURIComponent(ROOM) +
          '&ticket=' + encodeURIComponent(myTicket), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d.ok) { showMine(d.ticket, d.ahead, d.called); } })
      .catch(function () {});
  }

  $('takeBtn').addEventListener('click', function () {
    var btn = $('takeBtn');
    btn.disabled = true;
    fetch('/api/ticket', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: ROOM })
    })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { throw new Error('failed'); }
        myTicket = d.ticket;
        localStorage.setItem(TICKET_KEY, myTicket);
        showMine(myTicket, d.ahead, false);
        btn.textContent = '重新取号';
      })
      .catch(function () { alert('取号失败，请检查网络连接'); })
      .then(function () { setTimeout(function () { btn.disabled = false; }, 800); });
  });

  if (myTicket) {
    $('takeBtn').textContent = '重新取号';
    queryMine();
  }

  refresh();
  setInterval(function () {
    refresh();
    queryMine();
  }, REFRESH_MS);
</script>
</body>
</html>
